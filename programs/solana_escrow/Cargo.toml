
[package]
name = "solana_escrow"
version = "0.1.0"
description = "A demonstration Solana escrow program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = { version = "0.30.1", features = ["associated_token", "token"] }
